[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afriguard"
version = "0.1.0"
description = "Afrocentric safety-alignment data generation pipeline for African languages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["safety", "alignment", "african-languages", "nlp", "data-generation"]

dependencies = [
    # LLM Providers
    "openai>=1.35.0",
    "anthropic>=0.28.0",
    "google-generativeai>=0.7.0",
    # Data & Schemas
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    "psycopg2-binary>=2.9.9",
    # HuggingFace
    "datasets>=2.19.0",
    "huggingface-hub>=0.23.0",
    # NLP / Filtering
    "sentence-transformers>=3.0.0",
    "langdetect>=1.0.9",
    "langid>=1.1.6",
    "datasketch>=1.6.5",
    "numpy>=1.26.4,<2.0",
    "scikit-learn>=1.4.2",
    # Observability
    "structlog>=24.1.0",
    "rich>=13.7.0",
    # Pipeline & CLI
    "click>=8.1.7",
    "tqdm>=4.66.4",
    "tenacity>=8.3.0",
    # Web UI (review interface)
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
    # Config & Env
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    # HTTP
    "httpx>=0.27.0",
    # Storage
    "boto3>=1.34.0",
]

[project.optional-dependencies]
lid = [
    "fasttext-wheel>=0.9.2",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "types-tqdm>=4.66.0",
    "httpx>=0.27.0",  # for TestClient
]

[project.scripts]
afriguard = "src.pipeline.dag:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
