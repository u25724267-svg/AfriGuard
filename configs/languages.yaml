version: "1.0.0"
description: >
  Central registry for languages supported by AfriGuard. To add a language,
  add one entry here, add seed sources in configs/seed_sources.yaml, add
  cultural entities in data/seeds/custom/afriguard_lexicon.json, and add the
  reviewer password variable to .env.

languages:
  - name: "hausa"
    display_name: "Hausa"
    code: "ha"
    iso_639_3: "hau"
    region: "Nigeria / Niger / West Africa"
    countries: ["Nigeria"]
    reviewer_id: "reviewer_hausa"
    password_env: "PASS_HAUSA"
    default_password: "hausa_review_poc"
    flag: "NG"
    low_resource_detection: false
    char_ngram_similarity: false
    aliases: ["hausa", "ha", "hau"]
    prompt_instruction: >
      Write the user prompt ENTIRELY in Hausa (Harshen Hausa). Do NOT use
      English. Use authentic Hausa vocabulary and phrasing as spoken in
      northern Nigeria.
    response_instruction: >
      Respond ENTIRELY in Hausa (Harshen Hausa). Do NOT use English. Use
      authentic Hausa vocabulary and phrasing as spoken in northern Nigeria.

  - name: "sepedi"
    display_name: "Sepedi"
    code: "sep"
    iso_639_3: "nso"
    region: "South Africa (Limpopo)"
    countries: ["South Africa"]
    reviewer_id: "reviewer_sepedi"
    password_env: "PASS_SEPEDI"
    default_password: "sepedi_review_poc"
    flag: "ZA"
    low_resource_detection: true
    char_ngram_similarity: false
    aliases:
      - "sepedi"
      - "northern sotho"
      - "sesotho sa leboa"
      - "sotho northern"
      - "sotho, northern"
      - "nso"
      - "sep"
    prompt_instruction: >
      Write the user prompt ENTIRELY in Sepedi (Sesotho sa Leboa). Do NOT use
