version: "1.0.0"
description: >
  AfriGuard target language set for scaling seed collection, batch planning,
  pilot generation, and reviewer coverage. This file is a planning manifest:
  languages listed here are not automatically enabled for generation until
  they are added to configs/languages.yaml with prompt/response instructions.

selection_policy:
  name: "afriguard_40_v1"
  count: 40
  scope: >
    High-impact African languages selected for reach, regional coverage,
    digital seed availability, safety relevance, and reviewer feasibility.
  exclusions:
    - "Colonial official languages such as English, French, and Portuguese are excluded from this target set."
    - "Broad Arabic macrolanguage coverage is excluded from v1; African Arabic varieties should be handled as a separate North Africa track."
  promotion_policy: >
    Start with pilot generation for each language. Promote to full batch
    generation only after seed-readiness, language identification, filtering,
    and reviewer checks pass.

tiers:
  - id: "tier_1"
    name: "High-resource / first wave"
    strategy: >
      Prioritize for seed ingestion and PKU-adapted pilot generation. These
      languages have stronger speaker reach, digital footprint, known NLP
      datasets, or already exist in AfriGuard.
    languages:
      - name: "swahili"
        display_name: "Swahili / Kiswahili"
        iso_639_3: "swa"
        countries: ["Tanzania", "Kenya", "Uganda", "DRC", "Rwanda", "Burundi"]
        region: "East and Central Africa"
        script: "Latin"
        status: "seed_discovery"
      - name: "hausa"
        display_name: "Hausa"
        iso_639_3: "hau"
        countries: ["Nigeria", "Niger", "Ghana", "Cameroon"]
        region: "West Africa / Sahel"
        script: "Latin"
        status: "generation_configured"
      - name: "yoruba"
        display_name: "Yoruba"
        iso_639_3: "yor"
        countries: ["Nigeria", "Benin", "Togo"]
        region: "West Africa"
        script: "Latin"
        status: "generation_configured"
      - name: "igbo"
        display_name: "Igbo"
        iso_639_3: "ibo"
        countries: ["Nigeria"]
        region: "West Africa"
        script: "Latin"
        status: "seed_discovery"
      - name: "amharic"
        display_name: "Amharic"
        iso_639_3: "amh"
        countries: ["Ethiopia"]
        region: "Horn of Africa"
        script: "Ge'ez"
        status: "seed_discovery"
      - name: "oromo"
        display_name: "Oromo / Afaan Oromoo"
        iso_639_3: "orm"
        countries: ["Ethiopia", "Kenya"]
        region: "Horn of Africa"
        script: "Latin"
        status: "seed_discovery"
      - name: "somali"
        display_name: "Somali"
        iso_639_3: "som"
        countries: ["Somalia", "Djibouti", "Ethiopia", "Kenya"]
        region: "Horn of Africa"
        script: "Latin"
        status: "seed_discovery"
      - name: "shona"
        display_name: "Shona"
        iso_639_3: "sna"
        countries: ["Zimbabwe", "Mozambique"]
        region: "Southern Africa"
        script: "Latin"
        status: "generation_configured"
      - name: "kinyarwanda"
        display_name: "Kinyarwanda"
        iso_639_3: "kin"
        countries: ["Rwanda"]
        region: "East Africa"
        script: "Latin"
        status: "seed_discovery"
      - name: "tigrinya"
