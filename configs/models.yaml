version: "1.0.0"
models:
  gpt-4o:
    provider: "openai"
    model_id: "gpt-4o"
    max_tokens: 1024
    temperature: 0.9
    top_p: 1.0
    frequency_penalty: 0.3
    presence_penalty: 0.0
    cost_per_1k_input_tokens: 0.005
    cost_per_1k_output_tokens: 0.015
    supports_languages: ["hausa", "sepedi", "chichewa", "northern_sotho", "yao", "yoruba", "shona"]
    tier: "primary"

  gpt-4o-mini:
    provider: "openai"
    model_id: "gpt-4o-mini"
    max_tokens: 1024
    temperature: 0.9
    top_p: 1.0
    frequency_penalty: 0.3
    presence_penalty: 0.0
    cost_per_1k_input_tokens: 0.00015
    cost_per_1k_output_tokens: 0.0006
    supports_languages: ["hausa", "yoruba", "shona"]
    tier: "economy"
    notes: "Use only for Hausa, Yoruba, and Shona where quality is acceptable. Avoid for lower-resource languages."

  claude-3-5-sonnet:
    provider: "anthropic"
    model_id: "claude-3-5-sonnet-20241022"
    max_tokens: 1024
    temperature: 0.9
    cost_per_1k_input_tokens: 0.003
    cost_per_1k_output_tokens: 0.015
    supports_languages: ["hausa", "yoruba", "shona"]
    tier: "secondary"
    notes: "Secondary provider for diversity. Requires ANTHROPIC_API_KEY."

  gemini-1-5-pro:
    provider: "google"
    model_id: "gemini-1.5-pro"
    max_tokens: 1024
    temperature: 0.9
    cost_per_1k_input_tokens: 0.00125
    cost_per_1k_output_tokens: 0.005
    supports_languages: ["hausa", "yoruba", "shona"]
    tier: "secondary"
    notes: "Optional. Requires GOOGLE_API_KEY."

defaults:
  prompt_model: "gpt-4o"
  response_model: "gpt-4o"
  judge_model: "gpt-4o"
  budget_alert_threshold_usd: 50.0
  budget_hard_limit_usd: 200.0
