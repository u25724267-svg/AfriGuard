version: "1.0.0"
description: >
  Afrocentric seed dataset registry. Each entry defines a dataset to ingest,
  its source, target languages, primary harm domains, and license.

sources:
  - id: "afrisenti"
    name: "AfriSenti"
    description: "Twitter sentiment dataset for African languages including hate speech signals"
    type: "huggingface"
    hf_path: "shmuhammad/AfriSenti-twitter-sentiment"
    hf_split: "train"
    languages: ["hausa", "yoruba"]
    harm_domains: ["H01", "H07"]
    text_column: "tweet"
    license: "CC BY 4.0"
    notes: "Primary hate speech and sentiment seed for Hausa and Yoruba"

  - id: "masakhaner2"
    name: "MasakhaNER 2.0"
    description: "Named entity recognition dataset for African languages; used for cultural entity injection"
    type: "huggingface"
    hf_path: "masakhane/masakhaner2"
    hf_split: "train"
    languages: ["hausa", "yoruba"]
    harm_domains: ["entities"]
    text_column: "tokens"
    is_token_list: true
    license: "CC BY 4.0"
    notes: "Provides authentic names, locations, organisations for prompt grounding"

  - id: "masakhanews"
    name: "MasakhaNEWS"
    description: "African news classification dataset; provides real-world news context"
    type: "huggingface"
    hf_path: "masakhane/masakhanews"
    hf_split: "train"
    languages: ["hausa", "yoruba"]
    harm_domains: ["H04", "H09", "context"]
    text_column: "text"
    license: "CC BY 4.0"
    notes: "News context seeds for disinformation and extremism categories"

  - id: "naijasenti"
    name: "NaijaSenti"
    description: "Nigerian Twitter sentiment including Hausa, Yoruba, Igbo, Pidgin"
    type: "huggingface"
    hf_path: "HausaNLP/NaijaSenti"
    hf_split: "train"
    languages: ["hausa", "yoruba"]
    harm_domains: ["H01", "H07"]
    text_column: "tweet"
    license: "CC BY 4.0"
    notes: "Good source of naturally occurring hate-adjacent language patterns"

  - id: "africahatesentiment"
    name: "Africa Hate Speech (Twitter)"
    description: "Hate speech dataset for African social media"
    enabled: false
    type: "huggingface"
    hf_path: "strombergnlp/broad_twitter_corpus"
    hf_split: "train"
    languages: ["hausa", "yoruba", "sepedi", "northern_sotho", "shona"]
    harm_domains: ["H01"]
    text_column: "text"
    license: "CC BY 4.0"
    notes: "Supplementary hate speech seeds"

  - id: "south_africa_legal_popia"
    name: "POPIA Legal Summary (South Africa)"
    description: "Protection of Personal Information Act; curated legal summary used as legal conditioning"
    type: "local"
    local_path: "data/seeds/legal/popia_2013.txt"
    fallback_url: "https://www.gov.za/sites/default/files/gcis_document/201409/3706726-11act4of2013protectionofpersonalinforcorrect.pdf"
    languages: ["sepedi", "northern_sotho"]
    harm_domains: ["H03"]
    text_column: "text"
    license: "Government publication (public domain)"
    notes: "Curated project summary used as legal_context for H03 prompts in South African language variants"

  - id: "nigeria_vapp_act"
    name: "Nigeria Violence Against Persons Prohibition Act 2015 Summary"
    description: "VAPP Act curated legal summary; legal grounding for GBV prompts"
    type: "local"
    local_path: "data/seeds/legal/nigeria_vapp_2015.txt"
    fallback_url: "https://placng.org/i/wp-content/uploads/2019/12/Violence-Against-Persons-Prohibition-Act-2015.pdf"
    languages: ["hausa", "yoruba"]
    harm_domains: ["H02"]
    text_column: "text"
    license: "Government publication (public domain)"
    notes: "Legal conditioning for H02 Hausa and Yoruba generation"

  - id: "malawi_gender_equality_act"
    name: "Malawi Gender Equality Act 2013 Summary"
    description: "Gender equality and GBV curated legal summary for Malawi"
    type: "local"
    local_path: "data/seeds/legal/malawi_gender_equality_2013.txt"
    fallback_url: "https://www.sdnp.org.mw/index.php/resources/documents/legislation/gender/94-malawi-gender-equality-act/file"
    languages: ["chichewa", "yao"]
    harm_domains: ["H02", "H06"]
    text_column: "text"
    license: "Government publication (public domain)"

  - id: "sa_sexual_offences_act"
    name: "South Africa Sexual Offences and Related Matters Amendment Act 32 of 2007 Summary"
    description: "Sexual offences curated legal summary for South African context"
    type: "local"
    local_path: "data/seeds/legal/sa_sexual_offences_2007.txt"
    fallback_url: ""
    languages: ["sepedi", "northern_sotho"]
    harm_domains: ["H02"]
    text_column: "text"
    license: "Government publication (public domain)"

  - id: "vukuzenzele_sepedi"
    name: "Vuk'uzenzele Sepedi Government Context"
    description: >
      South African government magazine articles in Sepedi/Northern Sotho for
      public services, citizen rights, safety, health, privacy, and civic context.
    type: "huggingface"
    hf_path: "dsfsi/vukuzenzele-monolingual"
    hf_config: "nso"
    hf_split: "train"
    languages: ["sepedi"]
    harm_domains: ["H02", "H03", "H04", "H06", "H08", "context"]
    text_column: "text"
    license: "CC BY 4.0"
    notes: "High-priority Sepedi context source for South African public-sector and safety scenarios"

  - id: "yoruba_news_corpus"
    name: "Yoruba News Corpus"
    description: "Yoruba news text for cultural context seeding"
    type: "huggingface"
    hf_path: "castorini/yoruba_news"
    hf_split: "train"
    languages: ["yoruba"]
    harm_domains: ["H04", "context"]
    text_column: "article"
    license: "CC BY 4.0"

  - id: "hausa_voa"
    name: "Hausa VOA News"
    description: "Hausa Voice of America news articles for cultural context"
    type: "huggingface"
    hf_path: "HausaNLP/HausaVOA-NER"
    hf_split: "train"
    languages: ["hausa"]
    harm_domains: ["H04", "H09", "context"]
    text_column: "tokens"
    is_token_list: true
    license: "CC BY 4.0"

  - id: "shona_news_context"
    name: "Shona News Context"
    description: "Shona news/context seed text for Zimbabwe-specific cultural grounding"
    type: "huggingface"
    hf_path: "masakhane/masakhanews"
    hf_config: "sna"
    hf_split: "train"
    languages: ["shona"]
    harm_domains: ["H04", "H09", "context"]
    text_column: "text"
    license: "CC BY 4.0"
    notes: "Used as a Shona/Zimbabwe context seed where available in the upstream corpus"

  - id: "custom_afriguard_lexicon"
    name: "AfriGuard Cultural Lexicon"
    description: "Hand-curated list of culturally authentic names, places, and expressions per language"
    type: "local"
    local_path: "data/seeds/custom/afriguard_lexicon.json"
    languages: ["hausa", "sepedi", "chichewa", "northern_sotho", "yao", "yoruba", "shona"]
    harm_domains: ["entities"]
    text_column: "name"
    license: "AfriGuard (MIT)"
    notes: "Created by research team. Used for entity injection in all prompts."

  - id: "za_mafoko_dsac"
    name: "za-mafoko DSAC Terminology (Sepedi)"
    description: >
      Official multilingual terminologies from the Department of Sport, Arts
      and Culture. Includes Sepedi institutional names, governance vocabulary,
      and formal terminology.
    type: "huggingface"
    hf_path: "dsfsi/za-mafoko-dsac"
    hf_split: "train"
    languages: ["sepedi", "northern_sotho"]
    harm_domains: ["entities"]
    text_column: "nso"
    license: "CC BY 4.0"
    notes: "Phrase-level terminology. A future text_template adapter should combine source and target terms before large-scale ingestion."

  - id: "za_mafoko_statssa"
    name: "za-mafoko StatsSA Terminology (Sepedi)"
    description: >
      Statistics South Africa multilingual terminology covering population
      statistics, agriculture, and economic terms in all 11 official languages.
    type: "huggingface"
    hf_path: "dsfsi/za-mafoko-statssa"
    hf_split: "train"
    languages: ["sepedi", "northern_sotho"]
    harm_domains: ["entities"]
    text_column: "nso"
    license: "CC BY 4.0"
    notes: "Phrase-level terminology useful for financial/economic entity injection."

  - id: "za_mafoko_up_glossary"
    name: "za-mafoko University of Pretoria Glossary (Sepedi)"
    description: >
      Academic Sepedi glossaries from the University of Pretoria supporting
      multilingual teaching and learning across disciplines.
    type: "huggingface"
    hf_path: "dsfsi/za-mafoko-up-glossary"
    hf_split: "train"
    languages: ["sepedi", "northern_sotho"]
    harm_domains: ["entities"]
    text_column: "nso"
    license: "CC BY 4.0"
    notes: "Phrase-level academic and institutional vocabulary."

  - id: "nchlt_text_sepedi"
    name: "NCHLT Sepedi Text Corpus (SADiLaR)"
    description: >
      Sepedi text crawled from South African gov.za websites between 2007 and
      2011. Covers formal policy documents, legal terminology, and state protocols.
    enabled: false
    type: "local"
    local_path: "data/seeds/sepedi/nchlt_sepedi.txt"
    languages: ["sepedi", "northern_sotho"]
    harm_domains: ["H03", "H04"]
    text_column: "text"
    license: "Research use; check SADiLaR terms before redistribution"
    notes: "Manual download required. Convert into JSONL segments before large-scale ingestion."

  - id: "sepedi_emotion_corpus"
    name: "Sepedi Emotional Speech Corpus (University of Limpopo)"
    description: >
      Sepedi text with emotion labels such as anger, fear, disgust, sadness,
      happiness, and neutral.
    enabled: false
    type: "local"
    local_path: "data/seeds/sepedi/sepedi_emotion.txt"
    languages: ["sepedi"]
    harm_domains: ["H01", "H07"]
    text_column: "text"
    license: "Academic use; contact data owner"
    notes: "Manual data request required before use."

  - id: "chichewa_sentiments"
    name: "Chichewa Sentiments Corpus"
    description: >
      Community-contributed Chichewa sentiment text with positive/negative labels.
      The closest publicly available proxy for emotionally charged and hostile
      language in Chichewa.
    type: "huggingface"
    hf_path: "michsethowusu/chichewa-sentiments-corpus"
    hf_split: "train"
    languages: ["chichewa"]
    harm_domains: ["H01", "H07"]
    text_column: "text"
    license: "CC BY 4.0"
    notes: "Sentiment proxy for H01 and H07. Verify language quality with the Chichewa researcher before scaling."
