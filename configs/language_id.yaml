version: "1.0.0"
description: >
  Language-identification policy for AfriGuard filtering. This file is meant
  to be edited during calibration: reviewers can tune thresholds, accepted
  GlotLID labels, contaminant labels, and review flags without touching code.

glotlid:
  enabled: true
  # Set either this value or the GLOTLID_MODEL_PATH environment variable.
  # Example: data/models/glotlid/model.bin
  model_path: null
  model_env_var: "GLOTLID_MODEL_PATH"
  top_k: 5
  fallback_to_legacy: true
  fail_on_missing_model: false

thresholds:
  # Default confidence required when the top GlotLID label is accepted.
  default: 0.60
  # Short texts are less reliable, so they can require a stricter threshold.
  short_text: 0.72
  short_text_tokens: 20
  # If a contaminant language appears with at least this probability, the
  # detector records it as a contamination warning in the result details.
  contaminant_warning: 0.35
  # If the best accepted label is ahead of a contaminant by less than this
  # margin, the result is treated as code-switch/contamination suspect.
  code_switch_margin: 0.20
  # Related labels are not first-choice labels but may be valid dialect/script
  # neighbors. Their confidence is discounted unless promoted to accepted.
  related_label_multiplier: 0.65
  mismatch_multiplier: 0.10

text:
  min_chars: 10
  min_tokens_for_confident_auto_pass: 20
  short_text_policy: "raise_threshold"

contaminants:
  global:
    - eng_Latn
    - fra_Latn
    - por_Latn
    - arb_Arab
    - ara_Arab
    - ary_Arab
    - arz_Arab
    - afr_Latn

languages:
  - name: swahili
    glotlid_labels: [swh_Latn, swa_Latn]
    accepted_labels: [swh_Latn, swa_Latn]
    related_labels: []
    contaminant_labels: [eng_Latn, ara_Arab, arb_Arab]
    threshold: 0.62
    review_required: false
    notes: "Accept individual Swahili plus macrolanguage label if present."

  - name: hausa
    glotlid_labels: [hau_Latn]
    accepted_labels: [hau_Latn]
    related_labels: [hau_Arab]
    contaminant_labels: [eng_Latn, ara_Arab, arb_Arab]
    threshold: 0.62
    review_required: false
    notes: "Ajami is related, but Latin is the expected project script."

  - name: yoruba
    glotlid_labels: [yor_Latn]
    accepted_labels: [yor_Latn]
