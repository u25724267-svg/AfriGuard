<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AfriGuard — Stats</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    nav { background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; }
    nav .brand { color: #38bdf8; font-size: 1.25rem; font-weight: 700; }
    nav a { color: #94a3b8; text-decoration: none; margin-left: 16px; }
    nav a:hover { color: #38bdf8; }
    .container { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
    h2 { color: #38bdf8; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; color: #64748b; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    td { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    tr:hover td { background: rgba(255,255,255,0.03); }
    .approved { color: #6ee7b7; } .rejected { color: #fca5a5; } .flag { color: #fcd34d; } .escalate { color: #f97316; }
  </style>
</head>
<body>
  <nav>
    <div class="brand">🛡️ AfriGuard Review</div>
    <div><a href="/review">← Back to Review</a><a href="/logout">Sign out</a></div>
  </nav>
  <div class="container">
    <h2>📊 Annotation Statistics</h2>
    <table>
      <thead>
        <tr><th>Language</th><th>Decision</th><th>Count</th></tr>
      </thead>
      <tbody>
        {% for lang, decisions in stats.items() %}
          {% for decision, count in decisions.items() %}
          <tr>
            <td>{{ lang }}</td>
            <td class="{{ decision }}">{{ decision }}</td>
            <td>{{ count }}</td>
          </tr>
          {% endfor %}
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
