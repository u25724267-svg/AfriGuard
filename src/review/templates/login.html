<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfriGuard — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo h1 { color: #38bdf8; font-size: 2rem; letter-spacing: -0.5px; }
    .logo p { color: #94a3b8; font-size: 0.875rem; margin-top: 4px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; color: #cbd5e1; font-size: 0.875rem; margin-bottom: 8px; font-weight: 500; }
    select, input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07);
      color: #f1f5f9;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    select:focus, input:focus { border-color: #38bdf8; }
    select option { background: #1e293b; }
    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.875rem;
    }
    .flag { font-size: 1.5rem; margin-right: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>🛡️ AfriGuard</h1>
      <p>Safety Alignment Review Portal</p>
    </div>

    {% if error %}
    <div class="error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="reviewer_id">Reviewer Account</label>
        <select name="reviewer_id" id="reviewer_id" required>
          <option value="">— Select your language —</option>
          <option value="reviewer_hausa">🇳🇬 Hausa Reviewer</option>
          <option value="reviewer_yoruba">🇳🇬 Yoruba Reviewer</option>
          <option value="reviewer_sepedi">🇿🇦 Sepedi Reviewer</option>
          <option value="reviewer_northern_sotho">🇿🇦 Northern Sotho Reviewer</option>
          <option value="reviewer_chichewa">🇲🇼 Chichewa Reviewer</option>
          <option value="reviewer_yao">🇲🇼 Yao Reviewer</option>
          <option value="reviewer_shona">🇿🇼 Shona Reviewer</option>
          <option value="admin">🔐 Administrator</option>
        </select>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="Enter your review password" required>
      </div>
      <button type="submit" class="btn">Sign In →</button>
    </form>
  </div>
</body>
</html>
